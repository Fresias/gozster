name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck & Harness Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Harness² audit & drift check
        run: node scripts/qa-harness-audit.mjs --debt-mode warn

      - name: Typecheck (TypeScript)
        run: npm run typecheck

  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-cache-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-cache-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js application
        # GOZS-687: sin fallback a dev, el build exige estas variables (definidas en GitHub Actions).
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

  test-db:
    name: Tests (DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Run DB tests (Vitest)
        run: npx vitest run --project db

  test-rest:
    name: Tests (Unit & Harness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Run unit & harness tests (Vitest)
        run: npx vitest run --project unit --project harness

  verify:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [typecheck, build, test-db, test-rest]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Verify all required CI jobs succeeded
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test-db.result }}" != "success" ] || \
             [ "${{ needs.test-rest.result }}" != "success" ]; then
            echo "typecheck=${{ needs.typecheck.result }}"
            echo "build=${{ needs.build.result }}"
            echo "test-db=${{ needs.test-db.result }}"
            echo "test-rest=${{ needs.test-rest.result }}"
            exit 1
          fi

  post-merge:
    name: Harness² post-merge propose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Harness² Post-Merge Propose & Consolidate
        run: node harness-kit/core/scripts/harness-propose.mjs --post-merge

      - name: Upload Harness² candidates artifact
        uses: actions/upload-artifact@v7
        with:
          name: candidates
          path: .harness/candidates.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  harness-debt:
    name: Harness² lesson debt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Notify Multica on lesson debt threshold (>= 8)
        env:
          MULTICA_LESSON_DEBT_WEBHOOK_URL: ${{ secrets.MULTICA_LESSON_DEBT_WEBHOOK_URL }}
        run: node harness-kit/core/scripts/harness-debt-notify.mjs

      - name: Harness² lesson debt check
        run: node scripts/qa-harness-audit.mjs --debt-mode error

