name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Harness² audit & drift check
        run: node scripts/qa-harness-audit.mjs --debt-mode ${{ github.event_name == 'pull_request' && 'warn' || 'error' }}

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Run unit tests (Vitest)
        run: npx vitest run

      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-cache-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-cache-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js application
        run: npm run build

      - name: Harness² Post-Merge Propose & Consolidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node harness-kit/core/scripts/harness-propose.mjs --post-merge

      - name: Upload Harness² candidates artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: candidates
          path: .harness/candidates.json
          if-no-files-found: ignore
          retention-days: 14
