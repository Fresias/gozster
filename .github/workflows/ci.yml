name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Harness² merge check (seal == PR head, lesson, PPC)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node harness-kit/core/scripts/harness-merge-check.mjs ${{ github.event.pull_request.number }} --post-status

      - name: Harness² audit & drift check
        run: node scripts/qa-harness-audit.mjs

      - name: Run Harness² Kit specs & invariants
        run: npx vitest run harness-kit/tests/

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npx vitest run

      - name: Harness² Post-Merge Propose & Consolidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node harness-kit/core/scripts/harness-propose.mjs --post-merge
