name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: Harness drift check
        run: node harness-kit/core/scripts/harness-render.mjs --check

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npx vitest run
