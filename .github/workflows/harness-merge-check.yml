name: Harness² Merge Check

# Usa pull_request_target sobre la base (main) para que ningún PR pueda alterar
# el script, el workflow o harness/project.json y aprobarse solo.
# PROHIBIDO hacer checkout del head del PR o ejecutar código del PR.
on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: harness-merge-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-check:
    name: Harness² merge check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Harness² merge check (seal == PR head, lesson, PPC, authz)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node harness-kit/core/scripts/harness-merge-check.mjs ${{ github.event.pull_request.number }} --post-status --event-action ${{ github.event.action }}
