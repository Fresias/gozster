<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOZSter · Laboratorio UX Athlete App (U1) — Antes / Después</title>
<!--
  Prototipo descartable (GOZS-828 · U1). HTML5 + CSS + JS vanilla, cero dependencias externas.
  Tokens copiados de src/app/(athlete)/athlete/athlete-v7.css (modo Día y Noche).
  Paths del SVG RachaFlama copiados de src/lib/racha-flama.ts (SVG_PATHS_FLAMA).
  NO es código de producción: F2 aplica el JSON exportado en athlete-v7.css y componentes.
-->
<style>
/* ===== Tokens v7 (Día) ===== */
.lab {
  --a-bg:#FAFAFA; --a-surface:#FFFFFF; --a-surface-2:#F4F4F5; --a-fg:#09090B; --a-fg-2:#52525B; --a-fg-3:#71717A;
  --a-line:#E4E4E7; --a-line-strong:#71717A; --a-primary:#09090B; --a-on-primary:#FAFAFA;
  --a-ok-bg:#E3F4EE; --a-ok-fg:#00664A; --a-ok-ic:#009E73;
  --a-rec-bg:#FFF6DA; --a-rec-fg:#5C4300; --a-rec-ic:#A87B0B;
  --a-bad:#DC2626; --a-bad-soft:#FEF2F2; --a-bad-fg:#B91C1C;
  --a-hero:#09090B; --a-on-hero:#FAFAFA; --a-hero-2:#A1A1AA; --a-hero-line:#3F3F46;
  --a-chip-ss-bg:#09090B; --a-chip-ss-fg:#FAFAFA; --a-chip-ap-bg:#F4F4F5; --a-chip-ap-fg:#09090B; --a-chip-ap-line:#09090B;
  --a-elev-1:0 1px 2px rgba(9,9,11,.06),0 1px 3px 1px rgba(9,9,11,.04);
  --a-elev-2:0 1px 2px rgba(9,9,11,.08),0 3px 8px 2px rgba(9,9,11,.08);
  --a-silver:#D4D4D8;
}
.dark .lab {
  --a-bg:#09090B; --a-surface:#18181B; --a-surface-2:#27272A; --a-fg:#FAFAFA; --a-fg-2:#A1A1AA; --a-fg-3:#A1A1AA;
  --a-line:#27272A; --a-line-strong:#71717A; --a-primary:#FAFAFA; --a-on-primary:#09090B;
  --a-ok-bg:#062E25; --a-ok-fg:#5FD3B0; --a-ok-ic:#009E73;
  --a-rec-bg:#2A2208; --a-rec-fg:#F5D77A; --a-rec-ic:#D4A72C;
  --a-bad:#DC2626; --a-bad-soft:#2A1010; --a-bad-fg:#FCA5A5;
  --a-hero:#18181B; --a-on-hero:#FAFAFA; --a-hero-2:#A1A1AA; --a-hero-line:#3F3F46;
  --a-chip-ss-bg:#FAFAFA; --a-chip-ss-fg:#09090B; --a-chip-ap-bg:#27272A; --a-chip-ap-fg:#FAFAFA; --a-chip-ap-line:#FAFAFA;
  --a-elev-1:0 1px 2px rgba(0,0,0,.5);
  --a-elev-2:0 3px 8px 2px rgba(0,0,0,.5);
  --a-silver:#3F3F46;
}
/* Paletas de racha (racha-flama.ts) */
.lab [data-cat="hierro"]{--ic:#18181B;--bg:#FFFFFF;--fg:#09090B;--bd:#D4D4D8;--core:#fff;--tongue:#18181B}
.dark .lab [data-cat="hierro"]{--ic:#FAFAFA;--bg:#18181B;--fg:#FAFAFA;--bd:#3F3F46}
.lab [data-cat="bronce"]{--ic:#7A6338;--bg:#F5F3EC;--fg:#45371B;--bd:#A38B5D}
.dark .lab [data-cat="bronce"]{--ic:#C4A66B;--bg:#1C1A13;--fg:#EAE0C8;--bd:#7A6338}
.lab [data-cat="oro"]{--ic:#BE8700;--bg:#FFFDF5;--fg:#5C3F00;--bd:#C99714}
.dark .lab [data-cat="oro"]{--ic:#FACC15;--bg:#211C06;--fg:#FEF08A;--bd:#EAB308}
.lab [data-cat="diamante"]{--ic:#0369A1;--tongue:#0284C7;--core:#FFFFFF;--bg:#F0F9FF;--fg:#0C4A6E;--bd:#0284C7}
.dark .lab [data-cat="diamante"]{--ic:#38BDF8;--tongue:#0284C7;--core:#F0F9FF;--bg:#0B2239;--fg:#BAE6FD;--bd:#38BDF8}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;background:#E7E7EA;color:#09090B;font-size:14px}
.dark body{background:#000;color:#FAFAFA}
.f-d{font-family:"Archivo","Arial Black",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
.f-m{font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ===== Chrome del laboratorio ===== */
.bar{position:sticky;top:0;z-index:20;background:#09090B;color:#FAFAFA;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar h1{font-size:15px;margin:0 8px 0 0;font-family:"Archivo","Arial Black",sans-serif;letter-spacing:-.01em}
.seg{display:inline-flex;border:1px solid #52525B;border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:#D4D4D8;border:0;padding:8px 12px;font:600 13px inherit;cursor:pointer;min-height:36px}
.seg button[aria-pressed=true]{background:#FAFAFA;color:#09090B}
.btn{background:#FAFAFA;color:#09090B;border:0;border-radius:8px;padding:8px 14px;font:700 13px inherit;cursor:pointer;min-height:36px}
.btn.ghost{background:transparent;color:#FAFAFA;border:1px solid #52525B}
.tabs{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap}
.tabs button{border:1px solid #A1A1AA;background:#fff;color:#09090B;border-radius:999px;padding:8px 14px;font:700 13px inherit;cursor:pointer;min-height:40px}
.tabs button[aria-selected=true]{background:#09090B;color:#fff;border-color:#09090B}
.dark .tabs button{background:#18181B;color:#FAFAFA;border-color:#3F3F46}
.dark .tabs button[aria-selected=true]{background:#FAFAFA;color:#09090B}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:16px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.stage{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.col>b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#52525B}
.dark .col>b{color:#A1A1AA}
.panel{background:#fff;border:1px solid #D4D4D8;border-radius:12px;padding:14px;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.dark .panel{background:#18181B;border-color:#3F3F46}
.panel h2{font-size:14px;margin:0 0 4px}
.panel h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#52525B;margin:14px 0 6px}
.dark .panel h3{color:#A1A1AA}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0}
.ctl label{font-size:12.5px}
.ctl output{font:600 12px "Geist Mono",monospace;text-align:right}
.ctl input[type=range]{grid-column:1/3;width:100%;min-height:28px}
.ctl select{grid-column:1/3;min-height:36px}
.tog{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:6px 0;min-height:32px}
.hint{font-size:12px;color:#52525B;margin:6px 0}
.dark .hint{color:#A1A1AA}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#09090B;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* ===== Teléfono 390px ===== */
.phone{width:390px;height:780px;overflow:auto;border-radius:28px;border:8px solid #09090B;background:var(--a-bg);color:var(--a-fg);position:relative;scrollbar-width:none}
.dark .phone{border-color:#3F3F46}
.phone::-webkit-scrollbar{display:none}
.scr{padding:16px 14px 28px;display:grid;gap:12px;align-content:start}
.card{background:var(--a-surface);border:1px solid var(--a-line);border-radius:16px;box-shadow:var(--a-elev-1)}
.lbl{font:700 10.5px "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--a-fg-3)}
.h1{font:800 24px/1.1 "Archivo","Arial Black",sans-serif;letter-spacing:-.02em;margin:0}
.muted{color:var(--a-fg-2)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;border:1.5px solid var(--a-chip-ap-line);background:var(--a-chip-ap-bg);color:var(--a-chip-ap-fg);font-weight:800;letter-spacing:.05em;text-transform:uppercase;line-height:1;padding:5px 9px}
.chip.solid{background:var(--a-chip-ss-bg);color:var(--a-chip-ss-fg)}
.chip.mode{font-size:var(--p-chip-fs,10px)}
.chip.mode.lo{background:var(--a-surface-2);color:var(--a-fg-2);border-color:var(--a-line)}
.tap{min-width:48px;min-height:48px;border-radius:12px;border:1.5px solid var(--a-line-strong);background:var(--a-surface);color:var(--a-fg);font:800 22px "Archivo",sans-serif;display:inline-flex;align-items:center;justify-content:center}

/* ===== Racha (RachaFlama + chip) ===== */
.racha{display:inline-flex;align-items:center;gap:6px;padding:var(--p-racha-py,4px) calc(var(--p-racha-py,4px) + 5px);min-height:var(--p-racha-h,30px);border-radius:999px;background:var(--bg);color:var(--fg);border:1.5px solid var(--bd);box-shadow:var(--a-elev-1), 0 0 calc(var(--p-glow,0) * 0.28px) calc(var(--p-glow,0) * 0.06px) color-mix(in srgb,var(--ic) 55%,transparent);font-weight:800;letter-spacing:.04em;line-height:1;white-space:nowrap}
.racha .sem{font-size:var(--p-sem-fs,10.5px)}
.flama{width:var(--p-flama,16px);height:var(--p-flama,16px);color:var(--ic);overflow:visible;flex-shrink:0}
.flama .base{transform-box:fill-box;transform-origin:50% 100%}
.flama .flick{animation:flick var(--d,2.6s) ease-in-out infinite}
.flama .wave{animation:wave var(--wd,2.2s) linear infinite}
.flama .rise{transform:translateY(var(--h,0px))}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.985,1.035) skewX(-1.2deg)}50%{transform:scale(1.012,.98) skewX(0)}75%{transform:scale(1,1.025) skewX(1.2deg)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(12px)}}
@media(prefers-reduced-motion:reduce){.flama .flick,.flama .wave{animation:none}}

.day{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;min-height:64px}
.day .n{width:40px;height:40px;border-radius:10px;background:var(--a-surface-2);display:grid;place-items:center;font:800 18px "Archivo",sans-serif}
.day.hoy{border-color:var(--a-primary);border-width:2px}
.est{font:700 12px "Geist Mono",monospace;color:var(--a-fg-2)}
.hero{background:var(--a-hero);color:var(--a-on-hero);border-radius:20px;padding:16px;display:grid;gap:10px}
.hero .lbl{color:var(--a-hero-2)}

/* ===== Entrenamiento ===== */
.serie{padding:14px;display:grid;gap:var(--p-serie-gap,12px)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{border:1.5px solid var(--a-line-strong);border-radius:14px;padding:8px 10px;display:grid;gap:2px;position:relative}
.field .v{font:900 40px/1 "Archivo","Arial Black",sans-serif;font-variant-numeric:tabular-nums}
.stepper{display:flex;gap:6px;margin-top:4px}
.stepper .tap{flex:1;min-height:48px;font-size:20px}
.rpe-old{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.rpe-old button{min-height:34px;border:1px solid var(--a-line-strong);border-radius:6px;background:var(--a-surface);color:var(--a-fg);font:800 13px "Archivo",sans-serif;padding:0}
.rpe-new{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rpe-new button{display:flex;align-items:center;gap:8px;text-align:left;min-height:var(--p-rpe-h,48px);border:1.5px solid var(--a-line);border-radius:10px;background:var(--a-surface);color:var(--a-fg);padding:0 8px;cursor:pointer}
.rpe-new b{font:900 18px "Archivo",sans-serif;min-width:22px;text-align:center}
.rpe-new span{font-size:var(--p-rpe-fs,12px);line-height:1.15;color:var(--a-fg-2)}
.rpe-new button[aria-pressed=true],.rpe-old button[aria-pressed=true]{background:var(--a-primary);color:var(--a-on-primary);border-color:var(--a-primary)}
.rpe-new button[aria-pressed=true] span{color:var(--a-on-primary)}
.sug{background:var(--a-rec-bg);color:var(--a-rec-fg);border:1.5px solid var(--a-rec-ic);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.sug button{min-height:48px;border-radius:10px;border:0;background:var(--a-rec-ic);color:#fff;font:800 14px "Archivo",sans-serif}
.dark .sug button{color:#09090B}
.copied{display:inline-flex;gap:4px;align-items:center;font:700 11px "Geist Mono",monospace;color:var(--a-ok-fg);background:var(--a-ok-bg);border-radius:999px;padding:3px 8px;animation:cp 2.4s ease forwards}
@keyframes cp{0%{opacity:0;transform:translateY(3px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:.0}}
.done{min-height:56px;border-radius:14px;border:0;background:var(--a-ok-ic);color:#fff;font:900 16px "Archivo",sans-serif;letter-spacing:.03em}

/* ===== Historial ===== */
.ses{padding:var(--p-h-pad,12px);display:grid;gap:8px}
.ses .top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.datebox{width:var(--p-h-date,44px);height:var(--p-h-date,44px);border-radius:10px;background:var(--a-surface-2);display:grid;place-items:center;text-align:center;line-height:1}
.datebox b{font:900 calc(var(--p-h-date,44px) * .42) "Archivo",sans-serif}
.datebox i{font:700 9.5px "Geist Mono",monospace;font-style:normal;text-transform:uppercase;color:var(--a-fg-2)}
.srow{display:grid;grid-template-columns:28px 1fr auto;align-items:center;min-height:var(--p-h-row,28px);font-size:13px;border-top:1px dashed var(--a-line)}
.clases{display:grid;gap:8px;margin-top:var(--p-h-clases,12px)}
.clase{padding:var(--p-h-pad,12px);display:grid;gap:6px;border-left:4px solid var(--a-ok-ic)}
.nota{font-size:12.5px;color:var(--a-fg-2);border-left:2px solid var(--a-line-strong);padding-left:8px}

/* ===== Progreso ===== */
.cumpl-n{font:900 var(--p-c-fs,44px)/1 "Archivo","Arial Black",sans-serif;font-variant-numeric:tabular-nums}
.bar-t{height:10px;border-radius:999px;background:var(--a-hero-line);overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--a-ok-ic)}
.ring{width:calc(var(--p-c-fs,44px) * 2);height:calc(var(--p-c-fs,44px) * 2)}
.seg2{display:inline-flex;border:1.5px solid var(--a-line-strong);border-radius:10px;overflow:hidden}
.seg2 button{min-height:44px;min-width:56px;border:0;background:var(--a-surface);color:var(--a-fg);font:800 14px "Archivo",sans-serif;padding:0 14px}
.seg2 button[aria-pressed=true]{background:var(--a-primary);color:var(--a-on-primary)}
select.ex{min-height:48px;border-radius:12px;border:1.5px solid var(--a-line-strong);background:var(--a-surface);color:var(--a-fg);font:700 15px inherit;padding:0 10px;width:100%}
.podio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.pod{border-radius:12px 12px 4px 4px;border:1px solid var(--a-line);background:var(--a-surface-2);padding:8px 6px;text-align:center;display:grid;gap:2px;align-content:start}
.pod.p1{background:var(--a-primary);color:var(--a-on-primary)}
.pod .pos{font:900 20px "Archivo",sans-serif}
.pod .nm{font-weight:800;font-size:13px}
.pod .mk{font:700 12px "Geist Mono",monospace}
.rk{display:grid;grid-template-columns:var(--p-badge,28px) 1fr auto auto;gap:8px;align-items:center;min-height:var(--p-rk-h,48px);padding:0 10px;border-top:1px solid var(--a-line)}
.rk .bd{width:var(--p-badge,28px);height:var(--p-badge,28px);border-radius:999px;background:var(--a-surface-2);display:grid;place-items:center;font:800 12px "Geist Mono",monospace}
.rk.yo{background:var(--a-primary);color:var(--a-on-primary);border-radius:10px;border-top-color:transparent}
.rk.yo .bd{background:var(--a-on-primary);color:var(--a-primary)}
.rk small{display:block;font-size:11px;opacity:.75}
.rk .mk{font:700 12.5px "Geist Mono",monospace;text-align:right}
.ghosted{border:2px dashed var(--a-line-strong);border-radius:14px;padding:14px;color:var(--a-fg-2);font-size:13px}
.priv{font-size:11.5px;color:var(--a-fg-2)}
</style>
</head>
<body>
<div class="lab" id="lab">
  <div class="bar">
    <h1>Laboratorio UX · Athlete App <span style="opacity:.6;font-weight:500">U1 · GOZS-828</span></h1>
    <div class="seg" role="group" aria-label="Comparación" id="segMode">
      <button data-mode="before">Antes</button><button data-mode="after">Después</button><button data-mode="both">Lado a lado</button>
    </div>
    <div class="seg" role="group" aria-label="Tema" id="segTheme">
      <button data-theme="day">☀ Día</button><button data-theme="night">☾ Noche</button>
    </div>
    <button class="btn ghost" id="btnReset">Resetear valores recomendados</button>
    <button class="btn" id="btnExport">Exportar JSON</button>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="layout">
    <div class="stage" id="stage"></div>
    <aside class="panel" id="panel"></aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   1. PARÁMETROS — antes (estado actual v7) y recomendado (después)
   ============================================================ */
var SCHEMA = [
  { scene:"inicio", title:"Inicio / Mis Días", params:[
    { k:"flamaPx",     label:"Tamaño SVG llama",            unit:"px", min:16, max:36, step:1,   before:16,   rec:26,  v:"--p-flama" },
    { k:"chipPadY",    label:"Padding vertical chip racha", unit:"px", min:4,  max:12, step:1,   before:4,    rec:6,   v:"--p-racha-py" },
    { k:"chipMinH",    label:"Alto mínimo chip racha",      unit:"px", min:30, max:56, step:1,   before:30,   rec:44,  v:"--p-racha-h" },
    { k:"semanasFs",   label:"Tamaño texto N SEM",          unit:"px", min:10, max:18, step:0.5, before:10.5, rec:14,  v:"--p-sem-fs" },
    { k:"glow",        label:"Intensidad de glow",          unit:"%",  min:0,  max:100,step:5,   before:0,    rec:35,  v:"--p-glow" }
  ]},
  { scene:"entrenamiento", title:"Entrenamiento en vivo", params:[
    { k:"chipFs",      label:"Tamaño chips especiales",     unit:"px", min:9,  max:14, step:0.5, before:10,   rec:11.5,v:"--p-chip-fs" },
    { k:"chipContraste",label:"Contraste chips (0 suave · 100 sólido)", unit:"%", min:0, max:100, step:10, before:0, rec:100, v:null },
    { k:"rpeFilaH",    label:"Alto de fila RPE",            unit:"px", min:40, max:64, step:2,   before:34,   rec:48,  v:"--p-rpe-h" },
    { k:"rpeTextoFs",  label:"Tamaño texto corto RPE",      unit:"px", min:10, max:15, step:0.5, before:12,   rec:12.5,v:"--p-rpe-fs" },
    { k:"serieGap",    label:"Espaciado vertical tarjeta",  unit:"px", min:8,  max:24, step:1,   before:12,   rec:14,  v:"--p-serie-gap" }
  ]},
  { scene:"historial", title:"Historial compacto + Clases", params:[
    { k:"cardPad",     label:"Padding tarjetas",            unit:"px", min:8,  max:20, step:1,   before:18,   rec:12,  v:"--p-h-pad" },
    { k:"fechaPx",     label:"Bloque fecha (día/mes)",      unit:"px", min:36, max:60, step:1,   before:52,   rec:44,  v:"--p-h-date" },
    { k:"filaSerieH",  label:"Alto fila de series",         unit:"px", min:24, max:40, step:1,   before:38,   rec:28,  v:"--p-h-row" },
    { k:"clasesGap",   label:"Separación bloque Clases",    unit:"px", min:6,  max:24, step:1,   before:12,   rec:14,  v:"--p-h-clases" }
  ]},
  { scene:"progreso", title:"Mi Progreso + Funcional", params:[
    { k:"cumplFs",     label:"Escala % cumplimiento",       unit:"px", min:28, max:64, step:1,   before:28,   rec:48,  v:"--p-c-fs" },
    { k:"rankFilaH",   label:"Alto fila ranking",           unit:"px", min:40, max:64, step:2,   before:48,   rec:48,  v:"--p-rk-h" },
    { k:"podioH",      label:"Altura podio Top 3 (1°)",     unit:"px", min:60, max:120,step:4,   before:84,   rec:96,  v:null },
    { k:"badgePx",     label:"Badge de posición",           unit:"px", min:22, max:36, step:1,   before:28,   rec:30,  v:"--p-badge" }
  ]}
];
var CHOICES = { // selectores exportables (no sliders)
  cumplEstilo: { label:"Estilo indicador % cumplimiento", opts:["barra","anillo","numero"], rec:"barra" }
};
var SCENE_LABELS = { inicio:"1 · Inicio", entrenamiento:"2 · Entrenamiento", historial:"3 · Historial", progreso:"4 · Mi Progreso" };

var state = {
  mode:"both", theme:"day", scene:"inicio",
  values:{}, choices:{ cumplEstilo:"barra" },

    var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"})); a.download="athlete-ux-ajustes-params.json"; document.body.appendChild(a); a.click(); a.remove();
  }
  else if(t.dataset.rpe){ state.prev.rpe=+t.dataset.rpe; render(); }
  else if(t.dataset.cat&&t.closest(".seg2")){ state.prev.cat=t.dataset.cat; render(); }
  else if(t.id==="btnCopia"){ state.prev.copiaTick++; render(); }
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.k){
    state.values[t.dataset.k]=+t.value;
    var p=null; SCHEMA.forEach(function(s){ s.params.forEach(function(q){ if(q.k===t.dataset.k) p=q; }); });
    $("#o_"+t.dataset.k).textContent=t.value+p.unit;
    document.querySelectorAll('.phone[data-m="after"]').forEach(function(ph){ applyVars(ph,"after"); });
    if(p.k==="chipContraste"||p.k==="podioH") render_keepPanel();
  }
});
function render_keepPanel(){ // escenas que dependen del valor en el markup: re-render sin tocar el panel
  var y=document.querySelectorAll(".phone"); var sc=document.querySelectorAll(".phone");
  sc.forEach(function(p){ var sTop=p.scrollTop; p.innerHTML=SCENES[state.scene](p.dataset.m); p.scrollTop=sTop; applyVars(p,p.dataset.m); });
}
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="selRacha"){ state.prev.racha=t.value; render(); }
  else if(t.id==="selEstilo"){ state.choices.cumplEstilo=t.value; render(); }
  else if(t.dataset&&t.dataset.chip){ state.prev.chips[t.dataset.chip]=t.checked; render_keepPanel(); }
  else if(t.dataset&&t.dataset.ex!==undefined){ state.prev.ejercicio=t.value; render(); }
});
render();
</script>
</body>
</html>
