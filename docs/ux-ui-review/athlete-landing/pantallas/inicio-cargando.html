/* Athlete App · pulido visual (GOZS-448). Solo estilo: sin cambios de DOM, estado ni flujo.
   Selectores con :where() para que cualquier utilidad de Tailwind del componente siga ganando. */


/* Cifras como instrumento: pesos, reps, series y timers alineados en columnas. */
.theme-athlete :where(input, select, textarea, time, output, [inputmode="decimal"], [inputmode="numeric"]) {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

/* Títulos con el tracking de Studio. */
.theme-athlete :where(h1, h2, h3) { letter-spacing: -0.015em; }

/* Foco de teclado visible en todo control que no declare el suyo. */
.theme-athlete :where(a, button, [role="button"], input, select, textarea, summary):focus-visible {
  outline: 2px solid hsl(var(--ring));
  outline-offset: 2px;
}

/* Respuesta al toque: `scale` es independiente de `transform`, no pisa translate/rotate existentes. */
.theme-athlete :where(button:not(:disabled), [role="button"]) {
  transition-property: color, background-color, border-color, opacity, box-shadow, scale;
  transition-duration: 150ms;
}
.theme-athlete :where(button:not(:disabled), [role="button"]):active { scale: 0.98; }

/* Campos de texto y número con altura táctil cómoda. */
.theme-athlete :where(input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="hidden"]), select) {
  min-height: 44px;
}

@media (prefers-reduced-motion: reduce) {
  .theme-athlete :where(button, [role="button"]) { transition: none; }
  .theme-athlete :where(button, [role="button"]):active { scale: none; }
}

  * {
    @apply border-border;
  }

  body {
    @apply bg-background text-foreground antialiased selection:bg-primary/25 selection:text-primary font-sans;
    -webkit-tap-highlight-color: transparent;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  }

  /* Geist Mono exclusivamente para números tabulares (pesos, montos, horas) */
  .font-mono,
  .tabular-nums {
    font-variant-numeric: tabular-nums;

  /* Custom scrollbar for dark mode */
  ::-webkit-scrollbar {
    width: 6px;

  }

  ::-webkit-scrollbar-track {
    background: transparent;
  }

  ::-webkit-scrollbar-thumb {
    background: hsl(var(--muted-foreground) / 0.25);
    border-radius: 9999px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: hsl(var(--muted-foreground) / 0.4);
  }
}

/* Micro-Glitch Quirúrgico en CSS Puro (GOZS-441) */
@keyframes micro-glitch {
  0% {
    transform: translate(0);
    text-shadow: none;
  }
  20% {
    transform: translate(-1px, 1px);
    text-shadow: 1px 0 hsl(var(--primary) / 0.8), -1px 0 hsl(var(--muted-foreground) / 0.8);
  }
  40% {
    transform: translate(-1px, -1px);
    text-shadow: -1px 0 hsl(var(--primary) / 0.8), 1px 0 hsl(var(--muted-foreground) / 0.8);
  }
  60% {
    transform: translate(1px, 1px);
    text-shadow: 1px 0 hsl(var(--primary) / 0.8), -1px 0 hsl(var(--muted-foreground) / 0.8);
  }
  80% {
    transform: translate(1px, -1px);
    text-shadow: -1px 0 hsl(var(--primary) / 0.8), 1px 0 hsl(var(--muted-foreground) / 0.8);
  }
  100% {
    transform: translate(0);
    text-shadow: none;
  }
}

.glitch-hover:hover {
  animation: micro-glitch 0.22s ease-in-out infinite alternate;
}

/* Perspectiva 3D Hero Spectup */
.perspective-1200 {
  perspective: 1200px;
}

.transform-style-3d {
  transform-style: preserve-3d;
}

/* Retícula técnica de fondo del hero (solo decorativa, sin animación) */
.hero-grid {
  background-image:
    linear-gradient(hsl(var(--border) / 0.7) 1px, transparent 1px),
    linear-gradient(90deg, hsl(var(--border) / 0.7) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 25% 0%, #000 15%, transparent 75%);
  mask-image: radial-gradient(ellipse 90% 70% at 25% 0%, #000 15%, transparent 75%);
}

/* Inactivación absoluta ante prefers-reduced-motion: reduce */
@media (prefers-reduced-motion: reduce) {
  .glitch-hover,
  .glitch-hover:hover {
    animation: none !important;
    transform: none !important;
    text-shadow: none !important;
  }
  .hero-3d-card,
  .hero-3d-card:hover {
    transform: none !important;
    transition: none !important;
  }
}


/* Home storytelling: animaciones del relato (entrada del hero, tachado, marquesina, revelado y progreso) */
@keyframes landing-rise {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
.landing-rise {
  animation: landing-rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

@keyframes landing-strike {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
.landing-strike {
  position: relative;
  display: inline-block;
}
.landing-strike::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 56%;
  height: 0.085em;
  background: hsl(var(--foreground));
  transform-origin: left center;
  animation: landing-strike 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.9s both;
}

@keyframes landing-marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.landing-marquee-track {
  display: flex;
  width: max-content;
  animation: landing-marquee 90s linear infinite;
}
.landing-marquee:hover .landing-marquee-track {
  animation-play-state: paused;
}

[data-reveal] {
  transition:
    opacity 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) var(--reveal-delay, 0ms),
    transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) var(--reveal-delay, 0ms),
    color 0.15s,
    background-color 0.15s,
    border-color 0.15s;
}
[data-reveal].reveal-pending {
  opacity: 0;
  transform: translateY(28px);
}

/* Anclaje por capítulo: scroll suave; el header fijo se descuenta una sola vez (acá) */
html.landing-scroll {
  scroll-behavior: smooth;
  scroll-padding-top: var(--landing-header-h);
}
@media (min-width: 1024px) and (min-height: 760px) {
  html.landing-scroll {
    scroll-snap-type: y proximity;
  }
  html.landing-scroll .landing-section {
    scroll-snap-align: start;
  }
}

/* Pantallas bajas (notebooks): el contenido de cada capítulo se achica para entrar en un viewport.
   El contenedor compensa el zoom para seguir alineado con el header. */
.landing-section > * {
  zoom: var(--landing-zoom, 1);
}
@media (min-width: 1024px) {
  .landing-section .landing-container {
    max-width: calc(80rem / var(--landing-zoom, 1));
    padding-inline: calc(3rem / var(--landing-zoom, 1));
  }
  /* Fotos y capturas dependen del ancho: se achican en la misma proporción */
  .landing-section .landing-media {
    width: calc(100% * var(--landing-zoom, 1));
  }
}
@media (min-width: 1024px) and (max-height: 890px) {
  .landing-section { --landing-zoom: 0.94; }
}
@media (min-width: 1024px) and (max-height: 840px) {
  .landing-section { --landing-zoom: var(--landing-zoom-min); }
}

@keyframes landing-nudge {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 3px; }
}
.landing-nudge {
  animation: landing-nudge 1.8s ease-in-out infinite;
}

@keyframes landing-progress {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
.landing-progress {
  transform: scaleX(0);
  transform-origin: left center;
}
@supports (animation-timeline: scroll()) {
  .landing-progress {
    animation: landing-progress linear both;
    animation-timeline: scroll(root);
  }
}

/* Landing: selección de texto legible sobre cualquier fondo (botones oscuros incluidos) */
html .landing-root::selection,
html .landing-root *::selection {
  background: hsl(240 5% 52% / 0.4);
  color: currentColor;
}

/* Landing: microinteracciones */
.landing-btn > svg:last-child {
  transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.landing-btn:hover > svg:last-child {
  transform: translateX(4px);
}
.landing-shine {
  position: relative;
  overflow: hidden;
}
.landing-shine::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 35%, hsl(var(--primary-foreground) / 0.28) 50%, transparent 65%);
  transform: translateX(-120%);
  pointer-events: none;
}
.landing-shine:hover::before {
  transform: translateX(120%);
  transition: transform 0.7s ease;
}

/* Punto de presencia: late en el color del texto, sin salir de la paleta */
@keyframes landing-ping {
  0% { transform: scale(1); opacity: 0.7; }
  80%, 100% { transform: scale(2.6); opacity: 0; }
}
.landing-dot {
  position: relative;
}
.landing-dot::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 9999px;
  background: currentColor;
  animation: landing-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
}

/* Tachado que se dibuja al entrar en pantalla (funciona en varias líneas) */
.landing-tachar {
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-position: 0 58%;
  background-size: 100% 0.09em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  transition: background-size 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) calc(var(--reveal-delay, 0ms) + 350ms);
}
html.landing-motion [data-reveal]:not(.in-view) .landing-tachar,
html.landing-motion .landing-tachar[data-reveal]:not(.in-view) {
  background-size: 0% 0.09em;
}

/* Línea que se dibuja de izquierda a derecha (línea de tiempo, subrayados) */
.landing-linea {
  transform-origin: left center;
  transition: transform 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s;
}
html.landing-motion [data-reveal]:not(.in-view) .landing-linea,
html.landing-motion .landing-linea[data-reveal]:not(.in-view) {
  transform: scaleX(0);
}

/* Entrada con rebote para sellos y avisos (récord, burbujas de chat) */
@keyframes landing-pop {
  0% { opacity: 0; transform: scale(0.8) translateY(8px); }
  60% { opacity: 1; transform: scale(1.04) translateY(0); }
  100% { opacity: 1; transform: scale(1) translateY(0); }

<style id="propuesta">
/* Athlete App con el lenguaje de la landing.
   Sin overrides de --primary/--ring/--background/--card: rige la paleta zinc de :root y .dark
   (primary #18181B en claro, #FAFAFA en oscuro; fondo y tarjetas #FFFFFF / #09090B). */
.theme-athlete {
  --rest-timer-bg: var(--card);
  --rest-timer-time-fg: var(--foreground);
  --rest-timer-track-bg: var(--muted);
  --rest-timer-fill-bg: var(--primary);
  --rest-timer-fill-bg-paused: var(--warning-soft-foreground);

  /* Superserie y drop set: el violeta del constructor de rutinas como token semántico
     (hoy son purple-* de Tailwind hardcodeados; valores = purple-600 / purple-800 / purple-500). */
  --superset: 271 81% 56%;            /* #9333EA  ordinal y badge sólido (texto blanco 5.4:1) */
  --superset-foreground: 0 0% 100%;
  --superset-soft: 271 91% 65%;       /* #A855F7  fondos /10–/20 y bordes /30–/40 */
  --superset-soft-foreground: 273 67% 39%; /* #6B21A8  texto sobre el tinte (purple-800) */
}
.dark .theme-athlete,
.theme-athlete .dark {
  --superset-soft-foreground: 269 100% 92%; /* #E9D5FF  purple-200 */
  /* --neutral-soft de .dark es azul pizarra (217 33% 17%): en athlete pasa a zinc como el resto. */
  --neutral-soft: 240 3.7% 15.9%;
  --neutral-soft-foreground: 0 0% 98%;
  --neutral-soft-border: 240 5.3% 26%;
}
/* Selección de texto de la landing (.landing-root ::selection): legible también sobre botones primary. */
.theme-athlete ::selection { background: hsl(240 5% 52% / 0.4); color: currentColor; }

<script>
// El markup de cada modo es el DOM real de ese modo (p. ej. el ícono del ThemeToggle cambia).
function mockupAnidados(raiz){Array.prototype.forEach.call((raiz||document).querySelectorAll("button-anidado"),function(el){var b=document.createElement("button");Array.prototype.forEach.call(el.attributes,function(a){b.setAttribute(a.name,a.value)});while(el.firstChild)b.appendChild(el.firstChild);el.parentNode.replaceChild(b,el)})}
function mockupPintar(modo){var ui=document.getElementById("mockup-ui");Array.prototype.slice.call(document.body.childNodes).forEach(function(n){if(n!==ui&&!(n.tagName==="SCRIPT"))document.body.removeChild(n)});document.body.insertBefore(document.getElementById("markup-"+modo).content.cloneNode(true),ui);mockupAnidados();document.documentElement.classList.toggle("dark",mododark(modo));mockupDialogos();}
function mododark(m){return m==="dark"}
// Un <dialog open> estático no es modal: se reabre con showModal() como en la app (capa superior + backdrop).
function mockupDialogos(){Array.prototype.forEach.call(document.querySelectorAll("dialog[open]"),function(d){d.removeAttribute("open");try{d.showModal()}catch(e){d.setAttribute("open","")}})}
function mockupModo(){var d=!document.documentElement.classList.contains("dark");mockupPintar(d?"dark":"light");var q=location.hash.slice(1).split(",").filter(function(x){return x&&x!=="dark"&&x!=="light"});q.push(d?"dark":"light");history.replaceState(null,"","#"+q.join(","));}
if(document.documentElement.classList.contains("dark"))mockupPintar("dark");else{mockupAnidados();mockupDialogos();}
</script>
